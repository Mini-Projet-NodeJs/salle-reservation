name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend-client/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-client/package-lock.json
      - run: npm ci
      - run: npm run build -- --base-href /salle-reservation/
      - name: SPA fallback
        run: cp dist/salle-client/browser/index.html dist/salle-client/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-client/dist/salle-client/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4