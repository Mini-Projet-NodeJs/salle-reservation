<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventSpace – Template UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#5B3DF5',dark:'#3A22C4',tint:'#EFEBFF'},amber:'#FFB547',ink:'#16132B',mute:'#5E5A75',line:'#E3E0F0',page:'#F8F7FC'},fontFamily:{display:['Sora','system-ui','sans-serif'],sans:['"DM Sans"','system-ui','sans-serif']}}}}</script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:#F8F7FC;color:#16132B}</style>
</head>
<body class="font-sans">
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect}=React, html=htm.bind(React.createElement);
const cx=(...a)=>a.filter(Boolean).join(' '), eur=n=>n.toLocaleString('fr-FR')+' €';
const DN=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
/* ---------- données de démonstration ---------- */
const EQ=['Projecteur','Sono','Climatisation','Wi-Fi','Parking','Scène'];
const ROOMS=[{id:1,n:'Salle Carthage',c:120,p:30,e:['Projecteur','Sono','Climatisation'],t:'#DCD5FF',d:'#5B3DF5'},{id:2,n:'Le Jardin d’Hiver',c:80,p:60,e:['Wi-Fi','Parking','Scène'],t:'#FFE3B3',d:'#16132B'},{id:3,n:'Atelier Médina',c:40,p:28,e:['Projecteur','Wi-Fi'],t:'#CFEFE6',d:'#0B6B53'}];
const AVAIL=[1,4,7,8,11,14,15,18,21,22,25,28,29];
const ST={attente:['En attente','bg-[#FFF1D6] text-[#8A5200]'],validee:['Validée','bg-brand-tint text-brand-dark'],payee:['Payée','bg-[#DDF4EC] text-[#0B6B53]'],refusee:['Refusée','bg-[#FDE7E4] text-[#A3200F]'],neutre:['','bg-[#ECEAF3] text-[#4F4B66]']};
/* ---------- routage par hash ---------- */
const useHash=()=>{const g=()=>location.hash.slice(1)||'espace';const[h,s]=useState(g());useEffect(()=>{const f=()=>{s(g());scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return h};
const Link=({to,className,children})=>html`<a href=${'#'+to} className=${className}>${children}</a>`;
/* ---------- composants UI (style shadcn) ---------- */
const Btn=({to,v='p',sm,className,children,...p})=>{const c=cx('inline-flex items-center justify-center rounded-xl font-bold transition',sm?'h-9 px-3.5 text-sm':'h-11 px-5 text-[15px]',v==='p'?'bg-brand text-white hover:bg-brand-dark':'border-[1.5px] border-line bg-white text-ink hover:bg-brand-tint',className);return to?html`<${Link} to=${to} className=${c}>${children}<//>`:html`<button className=${c} ...${p}>${children}</button>`};
const Card=({className,children})=>html`<div className=${cx('rounded-[20px] border border-line bg-white',className)}>${children}</div>`;
const Chip=({children,off,onClick})=>html`<${onClick?'button':'span'} onClick=${onClick} className=${cx('inline-block rounded-full px-3 py-1 text-[13px] font-medium',off?'bg-white text-mute ring-[1.5px] ring-inset ring-line':'bg-brand-tint text-brand-dark')}>${children}<//>`;
const Badge=({s,label})=>html`<span className=${cx('inline-block rounded-full px-3 py-1 text-[13px] font-bold',ST[s][1])}>${label||ST[s][0]}</span>`;
const Field=({label,...p})=>html`<label className="mb-3.5 block text-[13px] text-mute">${label}<input className="mt-1.5 block h-11 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 text-base font-medium text-ink outline-none focus:border-brand" ...${p}/></label>`;
const Logo=({dark})=>html`<div className="flex items-center gap-2.5"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill=${dark?'#7A5FFF':'#5B3DF5'}/><circle cx="12" cy="16" r="5" fill="#fff"/><circle cx="21" cy="16" r="5" fill="#FFB547"/></svg><span className=${cx('font-display text-xl font-bold',dark?'text-white':'text-ink')}>EventSpace</span></div>`;
const StatCard=({l,v})=>html`<${Card} className="p-5"><span className="text-sm text-mute">${l}</span><p className="mt-1.5 font-display text-3xl font-bold">${v}</p><//>`;
const RoomImg=({r,h='h-36'})=>html`<div className=${cx('relative overflow-hidden',h)} style=${{background:r.t}}><span className="absolute -bottom-6 left-5 h-[72px] w-[72px] rounded-full" style=${{background:r.d}}/></div>`;
const RoomCard=({r})=>html`<${Card} className="overflow-hidden"><${RoomImg} r=${r}/><div className="p-6 pt-10"><div className="flex items-baseline justify-between"><h3 className="font-display text-xl font-bold">${r.n}</h3><b className="text-brand-dark">${r.p} €/h</b></div><p className="mb-3.5 mt-1.5 text-mute">Jusqu’à ${r.c} invités</p><div className="mb-5 flex flex-wrap gap-1.5">${r.e.map(e=>html`<${Chip} key=${e}>${e}<//>`)}</div><${Btn} to="salle" v="o" className="w-full">Voir la salle<//></div><//>`;
const Cal=({avail,blocked=[],booked=[],sel,onSel,client,h=44})=>html`<div className="grid grid-cols-7 gap-1.5 text-center font-medium">${['L','M','M','J','V','S','D'].map((d,i)=>html`<span key=${i} className="text-[13px] text-mute">${d}</span>`)}<span/>${Array.from({length:31},(_,i)=>i+1).map(n=>{const a=avail.includes(n),b=blocked.includes(n),k=booked.includes(n);const c=n===sel?'bg-brand font-bold text-white':k?'bg-[#FFE3B3] font-bold text-[#6B4200]':b?'bg-ink text-white':a?'bg-brand-tint font-bold text-brand-dark hover:bg-[#DCD5FF]':cx('bg-[#F1F0F6] text-[#5B5873]',client&&'line-through');return html`<button key=${n} disabled=${client&&!a} onClick=${()=>onSel&&onSel(n)} className=${cx('flex items-center justify-center rounded-[10px] text-sm',c)} style=${{height:h}}>${n}</button>`})}</div>`;
const Th=({cols,cells})=>html`<div className="grid gap-3 bg-[#F1EFF8] px-5 py-3.5 text-[13px] font-bold text-mute" style=${{gridTemplateColumns:cols}}>${cells.map(c=>html`<span key=${c}>${c}</span>`)}</div>`;
const Tr=({cols,children})=>html`<div className="grid items-center gap-3 border-t border-line px-5 py-4" style=${{gridTemplateColumns:cols}}>${children}</div>`;
/* ---------- gabarits ---------- */
const CL=[['accueil','Salles'],['reservations','Mes réservations'],['paiement','Paiements']];
const ClientShell=({active,children})=>html`<div><header className="flex h-[72px] items-center justify-between border-b border-line bg-white px-5 lg:px-14"><${Link} to="accueil"><${Logo}/><//><nav className="hidden gap-8 font-medium md:flex">${CL.map(([t,l])=>html`<${Link} key=${t} to=${t} className=${t===active?'font-bold text-brand-dark':''}>${l}<//>`)}</nav><div className="flex items-center gap-3"><span className="flex h-10 w-10 items-center justify-center rounded-full bg-brand-tint font-bold text-brand-dark">SB</span><span className="hidden font-medium sm:block">Sarra B.</span><${Link} to="espace" className="hidden text-sm font-medium text-mute sm:block">Quitter<//></div></header><main className="mx-auto max-w-[1280px] px-5 py-8 pb-24 lg:px-14">${children}</main></div>`;
const AG=[['agent-tableau','Tableau de bord'],['agent-salles','Mes salles'],['agent-dispo','Disponibilités'],['agent-demandes','Demandes']];
const AgentShell=({active,children})=>html`<div className="flex min-h-screen flex-col lg:flex-row"><aside className="flex flex-col gap-1.5 bg-ink p-5 text-[#D9D4F5] lg:w-64 lg:shrink-0"><div className="mb-4 lg:mb-7"><${Logo} dark/></div><nav className="flex gap-1.5 overflow-x-auto lg:flex-col">${AG.map(([t,l])=>html`<${Link} key=${t} to=${t} className=${cx('flex items-center whitespace-nowrap rounded-[10px] px-3.5 py-2.5',t===active&&'bg-[#2E2A52] font-bold text-white')}>${l}${t==='agent-demandes'&&html`<span className="ml-auto rounded-full bg-amber px-2 text-[13px] text-ink">2</span>`}<//>`)}</nav><div className="mt-auto hidden border-t border-[#34305A] p-3.5 lg:block">Karim A.<br/>Agent de salle<${Link} to="espace" className="mt-2 block text-sm text-[#B9B2E8]">Quitter<//></div></aside><main className="flex-1 overflow-x-hidden p-5 pb-24 lg:p-10">${children}</main></div>`;
const Head=({t,s,children})=>html`<div className="mb-6 flex flex-wrap items-center justify-between gap-3"><div><h1 className="font-display text-3xl font-bold tracking-tight">${t}</h1>${s&&html`<p className="mt-1.5 text-mute">${s}</p>`}</div>${children}</div>`;
/* ---------- pages communes ---------- */
const Login=({agent})=>html`<div className="flex min-h-screen flex-col md:flex-row"><div className=${cx('relative overflow-hidden p-10 text-white md:w-[44%] md:p-12',agent?'bg-ink':'bg-brand-dark')}><${Logo} dark/><h2 className="mt-14 max-w-md font-display text-4xl font-bold leading-tight md:mt-28">${agent?'Gérez vos salles et vos demandes':'Réservez la salle idéale pour votre événement'}</h2><p className="mt-4 max-w-sm text-[#E6E1FF]">${agent?'Publiez vos salles, ouvrez vos disponibilités et répondez aux demandes.':'Comparez les salles, choisissez un jour libre et envoyez votre demande en quelques clics.'}</p><span className="absolute -bottom-16 -right-16 h-72 w-72 rounded-full bg-[#7A5FFF]"/><span className="absolute bottom-14 right-36 h-20 w-20 rounded-full bg-amber"/></div><div className="flex flex-1 items-center justify-center p-8"><div className="w-full max-w-sm"><${Link} to="espace" className="mb-6 inline-block text-sm font-medium text-mute">← Changer d’espace<//><h1 className="font-display text-3xl font-bold">${agent?'Espace agent':'Connexion'}</h1><p className="mb-6 mt-1.5 text-mute">${agent?'Connectez-vous avec votre compte agent.':'Connectez-vous pour suivre vos réservations.'}</p><${Field} label="E-mail" defaultValue=${agent?'karim@exemple.com':'sarra@exemple.com'}/><${Field} label="Mot de passe" type="password" defaultValue="motdepasse"/><${Btn} to=${agent?'agent-tableau':'accueil'} className="mt-1.5 h-12 w-full">Se connecter<//>${!agent&&html`<p className="mt-5 text-center text-mute">Pas encore de compte ? <b className="text-brand-dark">Créer un compte</b></p>`}</div></div></div>`;
/* ---------- choix de l’espace ---------- */
const SP=[{to:'connexion',t:'Espace client',d:'Trouvez une salle, envoyez votre demande et payez en ligne.',l:['Recherche avec filtres','Calendrier des jours libres','Paiement sécurisé avec Stripe'],b:'Continuer en tant que client',k:false},{to:'agent-connexion',t:'Espace agent',d:'Gérez vos salles, vos disponibilités et vos demandes.',l:['Salles, prix et équipements','Jours ouverts et dates bloquées','Validation avec historique du client'],b:'Continuer en tant qu’agent',k:true}];
const Landing=()=>html`<div className="relative flex min-h-screen flex-col items-center overflow-hidden px-5 py-10"><span className="absolute -left-20 -top-20 h-72 w-72 rounded-full bg-brand-tint"/><span className="absolute -bottom-24 -right-16 h-80 w-80 rounded-full bg-[#FFE3B3]"/><div className="relative z-10 flex w-full max-w-4xl flex-1 flex-col items-center justify-center"><${Logo}/><h1 className="mt-10 text-center font-display text-4xl font-bold leading-tight tracking-tight md:text-5xl">Bienvenue sur EventSpace</h1><p className="mb-10 mt-3 text-center text-lg text-mute">Choisissez votre espace pour continuer.</p><div className="grid w-full gap-6 md:grid-cols-2">${SP.map(s=>html`<${Link} key=${s.to} to=${s.to} className=${cx('group block rounded-[28px] border p-8 transition hover:-translate-y-1 hover:shadow-xl',s.k?'border-ink bg-ink text-white':'border-line bg-white')}><div className="mb-6 flex"><span className=${cx('h-12 w-12 rounded-full',s.k?'bg-[#7A5FFF]':'bg-brand')}/><span className="-ml-3 h-12 w-12 rounded-full bg-amber"/></div><h2 className="font-display text-2xl font-bold">${s.t}</h2><p className=${cx('mb-5 mt-2',s.k?'text-[#D9D4F5]':'text-mute')}>${s.d}</p><ul className="mb-7 space-y-2">${s.l.map(x=>html`<li key=${x} className="flex items-center gap-2.5"><span className="h-1.5 w-1.5 rounded-full bg-amber"/>${x}</li>`)}</ul><span className=${cx('flex h-12 items-center justify-center rounded-xl font-bold',s.k?'bg-white text-ink':'bg-brand text-white group-hover:bg-brand-dark')}>${s.b}</span><//>`)}</div></div></div>`;
/* ---------- espace client ---------- */
const Home=()=>{const[sel,setSel]=useState([]);const list=ROOMS.filter(r=>sel.every(e=>r.e.includes(e)));const tg=e=>setSel(s=>s.includes(e)?s.filter(x=>x!==e):[...s,e]);const fl='block w-full bg-transparent text-base font-bold text-ink outline-none';
return html`<${ClientShell} active="accueil"><section className="grid items-center gap-10 py-4 lg:grid-cols-[1.1fr_1fr]"><div><h1 className="font-display text-4xl font-bold leading-[1.06] tracking-tight lg:text-[54px]">Trouvez la salle de votre prochain événement</h1><p className="mb-7 mt-4 max-w-lg text-lg leading-relaxed text-mute">Comparez les salles, vérifiez les jours libres et réservez en quelques minutes. Vous payez seulement quand l’agent a accepté.</p><${Card} className="grid gap-2 p-2.5 sm:grid-cols-[1fr_1fr_1fr_auto] sm:items-center"><label className="px-3 text-xs text-mute">Date<input className=${fl} defaultValue="15 déc. 2026"/></label><label className="px-3 text-xs text-mute sm:border-l sm:border-line">Invités<input className=${fl} defaultValue="85"/></label><label className="px-3 text-xs text-mute sm:border-l sm:border-line">Budget max<input className=${fl} defaultValue="60 €/h"/></label><${Btn} className="h-12 px-6">Rechercher<//><//></div><div className="relative hidden h-[350px] overflow-hidden rounded-[32px] bg-brand lg:block"><span className="absolute -right-14 -top-14 h-64 w-64 rounded-full bg-[#7A5FFF]"/><span className="absolute -bottom-20 left-14 h-60 w-60 rounded-full bg-amber"/><${Card} className="absolute left-12 top-16 w-72 p-5"><${Badge} s="payee" label="Libre le 15 déc."/><h3 className="mb-1 mt-3 font-display text-xl font-bold">Salle Carthage</h3><p className="text-mute">120 invités · 30 €/h</p><//><${Card} className="absolute bottom-12 right-10 w-60 p-4"><span className="text-[13px] text-mute">Votre demande</span><p className="font-display text-2xl font-bold">300 €</p><p className="text-mute">10 heures · à payer après validation</p><//></div></section><section className="mt-10"><div className="mb-5 flex flex-wrap items-center justify-between gap-3"><h2 className="font-display text-2xl font-bold">${list.length} salle${list.length>1?'s':''} disponible${list.length>1?'s':''}</h2><div className="flex flex-wrap gap-2">${EQ.slice(0,5).map(e=>html`<${Chip} key=${e} off=${!sel.includes(e)} onClick=${()=>tg(e)}>${e}<//>`)}</div></div>${list.length?html`<div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">${list.map(r=>html`<${RoomCard} key=${r.id} r=${r}/>`)}</div>`:html`<${Card} className="p-8 text-center text-mute">Aucune salle ne propose tous ces équipements.<//>`}</section><//>`};
const RoomPage=()=>{const r=ROOMS[0];const[h,setH]=useState(10);const[d,setD]=useState(15);const[g,setG]=useState(85);const[sent,setSent]=useState(false);const bad=g>r.c||g<1;
return html`<${ClientShell} active="accueil"><div className="grid items-start gap-10 lg:grid-cols-[1.5fr_1fr]"><div><${RoomImg} r=${r} h="h-64"/><div className="mb-1.5 mt-6 flex flex-wrap items-center justify-between gap-2"><h1 className="font-display text-3xl font-bold">${r.n}</h1><span className="font-display text-2xl font-bold text-brand-dark">${r.p} € <span className="text-[15px] font-medium text-mute">par heure</span></span></div><p className="mb-3.5 text-mute">12 rue des Jasmins · Jusqu’à ${r.c} invités · Gérée par Karim A.</p><div className="mb-5 flex flex-wrap gap-2">${[...r.e,'Wi-Fi'].map(e=>html`<${Chip} key=${e}>${e}<//>`)}</div><${Card} className="p-6"><div className="mb-3.5 flex justify-between"><h3 className="font-display text-lg font-bold">Décembre 2026</h3><span className="text-mute">Jours libres en violet</span></div><${Cal} avail=${AVAIL} sel=${d} onSel=${setD} client/><//></div><${Card} className="p-7 lg:sticky lg:top-6"><h2 className="font-display text-[22px] font-bold">Demander une réservation</h2><p className="mb-5 mt-1.5 text-mute capitalize">${DN[d%7]} ${d} décembre 2026</p><div className="mb-3.5 text-[13px] text-mute">Nombre d’heures<div className="mt-1.5 flex items-center gap-2.5"><${Btn} v="o" className="w-11 px-0" onClick=${()=>setH(Math.max(1,h-1))} aria-label="Moins d’une heure">−<//><span className="flex h-11 flex-1 items-center justify-center rounded-xl border-[1.5px] border-line text-base font-bold text-ink">${h}</span><${Btn} v="o" className="w-11 px-0" onClick=${()=>setH(Math.min(12,h+1))} aria-label="Une heure de plus">+<//></div></div><${Field} label=${'Invités (max. '+r.c+')'} type="number" value=${g} onChange=${e=>setG(+e.target.value)}/>${bad&&html`<p className="-mt-2 mb-3 text-sm font-medium text-[#A3200F]">Le nombre d’invités doit être compris entre 1 et ${r.c}.</p>`}<${Field} label="Type d’événement" defaultValue="Mariage"/><div className="flex justify-between border-t border-line py-3.5 text-mute"><span>${r.p} € × ${h} h</span><span>${eur(r.p*h)}</span></div><div className="flex items-center justify-between"><b>Total</b><span className="font-display text-[26px] font-bold">${eur(r.p*h)}</span></div><p className="mb-4 mt-1 text-[13px] text-mute">Le total change avec le nombre d’heures.</p>${sent?html`<div className="rounded-xl bg-[#DDF4EC] p-4 font-medium text-[#0B6B53]">Demande envoyée. L’agent vous répond par e-mail. <${Link} to="reservations" className="font-bold underline">Voir mes réservations<//></div>`:html`<${Btn} className="h-[52px] w-full" disabled=${bad} onClick=${()=>setSent(true)}>Envoyer la demande<//>`}<p className="mt-3.5 text-center text-[13px] text-mute">Vous payez après la validation de l’agent.</p><//></div><//>`};
const RES=[{d:15,n:'Salle Carthage',i:'10 h · 85 invités · Mariage',a:300,s:'attente'},{d:21,n:'Le Jardin d’Hiver',i:'8 h · 70 invités · Séminaire',a:480,s:'validee'},{d:22,n:'Salle Carthage',i:'5 h · 110 invités · Anniversaire',a:150,s:'payee'},{d:25,n:'Atelier Médina',i:'3 h · 20 invités · Atelier',a:84,s:'refusee'}];
const BookingRow=({b})=>html`<${Card} className="mb-3.5 flex flex-wrap items-center gap-x-5 gap-y-3 px-6 py-4"><div className="flex h-[72px] w-[72px] shrink-0 flex-col items-center justify-center rounded-2xl bg-brand-tint font-bold text-brand-dark"><span className="font-display text-2xl">${b.d}</span><span className="text-[13px]">déc.</span></div><div className="min-w-[160px] flex-1"><h3 className="font-display text-lg font-bold">${b.n}</h3><p className="mt-1 text-mute">${b.i}</p></div><span className="w-20 text-lg font-bold">${eur(b.a)}</span><span className="w-24"><${Badge} s=${b.s}/></span><div className="flex min-w-[200px] items-center justify-end gap-2.5">${b.s==='attente'&&html`<${Btn} sm v="o">Annuler<//>`}${b.s==='validee'&&html`<span className="text-[13px] text-mute">À payer sous 31 h</span><${Btn} sm to="paiement">Payer ${eur(b.a)}<//><${Btn} sm v="o">Annuler<//>`}${b.s==='payee'&&html`<${Btn} sm v="o">Reçu PDF<//>`}${b.s==='refusee'&&html`<span className="text-[13px] text-mute">Motif : salle fermée ce jour-là</span>`}</div><//>`;
const Reservations=()=>{const[f,setF]=useState('tous');const T=[['tous','Toutes'],['attente','En attente'],['validee','Validées'],['payee','Payées']];return html`<${ClientShell} active="reservations"><${Head} t="Mes réservations" s="Suivez vos demandes et payez celles que l’agent a validées."/><div className="mb-5 flex flex-wrap gap-2">${T.map(([k,l])=>html`<${Chip} key=${k} off=${f!==k} onClick=${()=>setF(k)}>${l}<//>`)}</div>${RES.filter(b=>f==='tous'||b.s===f).map(b=>html`<${BookingRow} key=${b.d} b=${b}/>`)}<//>`};
const Payment=()=>{const[ok,setOk]=useState(false);return html`<${ClientShell} active="paiement"><div className="grid gap-8 lg:grid-cols-[1fr_460px]"><${Card} className="p-8"><${Badge} s="validee" label="Validée par Karim A."/><h1 className="mb-1 mt-3.5 font-display text-3xl font-bold">Le Jardin d’Hiver</h1><p className="mb-6 text-mute">Lundi 21 décembre 2026 · 70 invités · Séminaire</p><div className="flex justify-between border-t border-line py-3.5 text-mute"><span>60 € × 8 h</span><span>480 €</span></div><div className="flex items-center justify-between border-t border-line pt-3.5"><b>Total à payer</b><span className="font-display text-3xl font-bold">480 €</span></div><p className="mt-5 rounded-xl bg-[#FFF1D6] p-3.5 font-medium text-[#8A5200]">Payez avant le 23 déc. à 10 h 30, sinon la réservation expire.</p><//><${Card} className="p-8"><h2 className="font-display text-[22px] font-bold">Paiement sécurisé</h2><p className="mb-5 mt-1 text-mute">Traité par Stripe (mode test)</p>${ok?html`<div className="rounded-xl bg-[#DDF4EC] p-5 font-medium text-[#0B6B53]">Paiement confirmé. Un e-mail de confirmation vous a été envoyé. <${Link} to="reservations" className="font-bold underline">Mes réservations<//></div>`:html`<${Field} label="Numéro de carte" defaultValue="4242 4242 4242 4242"/><div className="grid grid-cols-2 gap-3.5"><${Field} label="Expiration" defaultValue="12 / 28"/><${Field} label="CVC" defaultValue="123"/></div><${Btn} className="h-[52px] w-full" onClick=${()=>setOk(true)}>Payer 480 €<//><p className="mt-3.5 text-center text-[13px] text-mute">Vous serez prévenu par e-mail dès que le paiement est confirmé.</p>`}<//></div><//>`};

const Dash=()=>{const M=[['Juil.',920],['Août',1480],['Sept.',1180],['Oct.',2100],['Nov.',2840]];return html`<${AgentShell} active="agent-tableau"><${Head} t="Tableau de bord" s="Votre activité en un coup d’œil."/><div className="mb-6 grid grid-cols-2 gap-4 xl:grid-cols-4"><${StatCard} l="Demandes en attente" v="2"/><${StatCard} l="Réservations payées" v="9"/><${StatCard} l="Salles publiées" v="3"/><${StatCard} l="Revenus de novembre" v="2 840 €"/></div><div className="grid gap-5 xl:grid-cols-[1.3fr_1fr]"><${Card} className="p-6"><h3 className="mb-5 font-display text-lg font-bold">Revenus par mois</h3><div className="flex h-52 items-end gap-5">${M.map(([m,v])=>html`<div key=${m} className="flex h-full flex-1 flex-col justify-end text-center"><span className="text-[13px] font-bold">${eur(v)}</span><div className=${cx('my-1.5 rounded-[10px]',m==='Nov.'?'bg-brand':'bg-[#C9BFFF]')} style=${{height:(v/2840*75)+'%'}}/><span className="text-[13px] text-mute">${m}</span></div>`)}</div><//><${Card} className="p-6"><h3 className="mb-4 font-display text-lg font-bold">À traiter</h3>${[['Sarra Ben Ali','Salle Carthage · 15 déc. · 300 €'],['Marc Dupont','Atelier Médina · 18 déc. · 112 €']].map(([a,b])=>html`<div key=${a} className="border-t border-line py-3.5"><b>${a}</b><p className="mb-2.5 text-mute">${b}</p><${Btn} sm to="agent-demande">Examiner<//></div>`)}<//></div><//>`};
const AgentRooms=()=>{const C='1.6fr .8fr .8fr 1.8fr .9fr 1.6fr';return html`<${AgentShell} active="agent-salles"><${Head} t="Mes salles" s="Vous fixez le prix, la capacité et les équipements de chaque salle."><${Btn} to="agent-salle-form">Ajouter une salle<//><//><${Card} className="overflow-x-auto"><div className="min-w-[860px]"><${Th} cols=${C} cells=${['Salle','Capacité','Prix','Équipements','Statut','Actions']}/>${ROOMS.map(r=>html`<${Tr} key=${r.id} cols=${C}><b>${r.n}</b><span>${r.c} invités</span><b>${r.p} €/h</b><span className="flex flex-wrap gap-1.5">${r.e.map(e=>html`<${Chip} key=${e}>${e}<//>`)}</span><${Badge} s="payee" label="Publiée"/><span className="flex gap-2"><${Btn} sm v="o" to="agent-salle-form">Modifier<//><${Btn} sm v="o" to="agent-dispo">Disponibilités<//></span><//>`)}</div><//><//>`};

const AgentAvail=()=>{const[av,setAv]=useState(AVAIL);const[bl,setBl]=useState([24]);const[wd,setWd]=useState([0,1,4]);const[bd,setBd]=useState(24);const BK=[21,22];
const gen=()=>setAv(Array.from({length:31},(_,i)=>i+1).filter(n=>wd.includes(n%7)&&!bl.includes(n)));const block=()=>{if(bd>=1&&bd<=31){setBl(b=>b.includes(bd)?b:[...b,bd]);setAv(a=>a.filter(n=>n!==bd))}};
return html`<${AgentShell} active="agent-dispo"><${Head} t="Disponibilités" s="Salle Carthage · choisissez les jours où les clients peuvent réserver."/><div className="grid items-start gap-6 xl:grid-cols-[1.4fr_1fr]"><${Card} className="p-6"><h3 className="mb-3.5 font-display text-lg font-bold">Décembre 2026</h3><${Cal} avail=${av.filter(n=>!BK.includes(n))} blocked=${bl} booked=${BK} h=${46}/><div className="mt-4 flex flex-wrap gap-4 text-[13px] text-mute"><span><b className="text-brand-dark">■</b> Libre</span><span><b className="text-[#E0A33A]">■</b> Réservé</span><span><b className="text-ink">■</b> Bloqué</span><span><b className="text-[#B8B4C8]">■</b> Non ouvert</span></div><//><div className="flex flex-col gap-5"><${Card} className="p-6"><h3 className="mb-3.5 font-display text-lg font-bold">Ouvrir des jours récurrents</h3><div className="mb-4 flex flex-wrap gap-2">${['L','M','M','J','V','S','D'].map((d,i)=>html`<${Btn} key=${i} sm v=${wd.includes(i)?'p':'o'} className="w-11 px-0" onClick=${()=>setWd(w=>w.includes(i)?w.filter(x=>x!==i):[...w,i])}>${d}<//>`)}</div><div className="grid grid-cols-2 gap-3"><${Field} label="Du" defaultValue="1 déc. 2026"/><${Field} label="Au" defaultValue="31 janv. 2027"/></div><${Btn} className="w-full" onClick=${gen}>Générer les dates<//><//><${Card} className="p-6"><h3 className="mb-3.5 font-display text-lg font-bold">Bloquer une date</h3><${Field} label="Jour de décembre" type="number" value=${bd} onChange=${e=>setBd(+e.target.value)}/><${Field} label="Raison" defaultValue="Maintenance"/><${Btn} v="o" className="w-full" onClick=${block}>Bloquer cette date<//><//></div></div><//>`};
const REQ=[{id:1,c:'Sarra Ben Ali',r:'Salle Carthage',d:'15 déc.',i:'10 h · 85',a:300,s:'attente'},{id:2,c:'Marc Dupont',r:'Atelier Médina',d:'18 déc.',i:'4 h · 30',a:112,s:'attente'},{id:3,c:'Leïla Haddad',r:'Le Jardin d’Hiver',d:'21 déc.',i:'8 h · 70',a:480,s:'validee'},{id:4,c:'Omar Trabelsi',r:'Salle Carthage',d:'22 déc.',i:'5 h · 110',a:150,s:'payee'},{id:5,c:'Julie Martin',r:'Atelier Médina',d:'25 déc.',i:'3 h · 20',a:84,s:'refusee'}];
const Requests=()=>{const[f,setF]=useState('tous');const C='1.5fr 1.4fr 1fr 1.2fr .8fr 1fr 1.2fr';const T=[['tous','Toutes'],['attente','En attente'],['validee','Validées'],['refusee','Refusées']];
return html`<${AgentShell} active="agent-demandes"><${Head} t="Demandes de réservation" s="Ouvrez une demande pour voir l’historique du client avant de répondre."/><div className="mb-5 grid grid-cols-2 gap-4 xl:grid-cols-4"><${StatCard} l="En attente" v="2"/><${StatCard} l="Validées" v="1"/><${StatCard} l="Payées" v="1"/><${StatCard} l="Revenus du mois" v="2 840 €"/></div><div className="mb-4 flex flex-wrap gap-2">${T.map(([k,l])=>html`<${Chip} key=${k} off=${f!==k} onClick=${()=>setF(k)}>${l}<//>`)}</div><${Card} className="overflow-x-auto"><div className="min-w-[860px]"><${Th} cols=${C} cells=${['Client','Salle','Date','Durée · invités','Montant','Statut','Action']}/>${REQ.filter(q=>f==='tous'||q.s===f).map(q=>html`<${Tr} key=${q.id} cols=${C}><b>${q.c}</b><span>${q.r}</span><span>${q.d}</span><span>${q.i}</span><b>${eur(q.a)}</b><${Badge} s=${q.s}/>${q.s==='attente'?html`<${Btn} sm to="agent-demande">Examiner<//>`:html`<span className="text-sm text-mute">—</span>`}<//>`)}</div><//><//>`};
const HIST=[['12 sept. 2026','Salle Carthage',150,'Terminée'],['2 juil. 2026','Atelier Médina',84,'Terminée'],['18 mars 2026','Salle Carthage',180,'Annulée par le client'],['5 janv. 2026','Le Jardin d’Hiver',360,'Terminée']];
const History=({name})=>html`<${Card} className="p-6"><div className="mb-4 flex flex-wrap items-center justify-between gap-2"><h3 className="font-display text-lg font-bold">Historique de ${name}</h3><span className="text-[13px] text-mute">Sur vos salles uniquement</span></div><div className="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-5">${[['4','réservations','bg-brand-tint text-brand-dark'],['3','terminées','bg-[#DDF4EC] text-[#0B6B53]'],['1','annulée','bg-[#ECEAF3] text-ink'],['0','refusée','bg-[#FDE7E4] text-[#A3200F]'],['594 €','déjà payés','bg-[#F1EFF8] text-ink']].map(([v,l,c])=>html`<div key=${l} className=${cx('rounded-2xl px-3.5 py-3',c)}><span className="font-display text-2xl font-bold">${v}</span><p className="text-[13px] text-mute">${l}</p></div>`)}</div><div className="overflow-x-auto"><div className="min-w-[420px]">${HIST.map(([d,r,a,s])=>html`<div key=${d} className="grid grid-cols-[1.1fr_1.3fr_.7fr_1fr] items-center gap-2 border-t border-line py-3"><span>${d}</span><span>${r}</span><b>${eur(a)}</b><${Badge} s="neutre" label=${s}/></div>`)}</div></div><//>`;
const KV=({k,v})=>html`<div><p className="text-[13px] text-mute">${k}</p><p className="font-bold">${v}</p></div>`;
const Request=()=>{const[s,setS]=useState('attente');const[m,setM]=useState('');const[err,setErr]=useState(false);const refuse=()=>m.trim()?(setS('refusee'),setErr(false)):setErr(true);
return html`<${AgentShell} active="agent-demandes"><${Link} to="agent-demandes" className="font-medium text-mute">← Retour aux demandes<//><div className="mb-5 mt-2.5 flex flex-wrap items-center gap-3.5"><h1 className="font-display text-3xl font-bold">Demande de Sarra Ben Ali</h1><${Badge} s=${s}/></div><div className="grid items-start gap-5 xl:grid-cols-[1.6fr_1fr]"><div className="flex flex-col gap-5"><${Card} className="p-6"><h3 className="mb-4 font-display text-lg font-bold">Détails de la demande</h3><div className="grid grid-cols-2 gap-4 sm:grid-cols-3"><${KV} k="Salle" v="Salle Carthage"/><${KV} k="Date" v="Mardi 15 déc. 2026"/><${KV} k="Durée" v="10 heures"/><${KV} k="Invités" v="85 sur 120"/><${KV} k="Événement" v="Mariage"/><${KV} k="Envoyée" v="le 5 nov. à 09 h 12"/></div><//><${History} name="Sarra Ben Ali"/></div><${Card} className="p-6"><p className="text-mute">Montant de la demande</p><p className="font-display text-4xl font-bold">300 €</p><p className="mb-5 text-sm text-mute">30 € × 10 h</p>${s==='attente'?html`<${Btn} className="h-[50px] w-full" onClick=${()=>setS('validee')}>Valider la demande<//><p className="mb-5 mt-2.5 text-[13px] text-mute">Le client aura 48 h pour payer.</p><div className="border-t border-line pt-5"><${Field} label="Motif du refus (obligatoire)" value=${m} onChange=${e=>setM(e.target.value)} placeholder="Ex. salle indisponible ce jour-là"/>${err&&html`<p className="-mt-2 mb-3 text-sm font-medium text-[#A3200F]">Indiquez un motif pour refuser.</p>`}<${Btn} v="o" className="h-[50px] w-full text-[#A3200F]" onClick=${refuse}>Refuser la demande<//></div>`:html`<div className=${cx('rounded-xl p-4 font-medium',s==='validee'?'bg-brand-tint text-brand-dark':'bg-[#FDE7E4] text-[#A3200F]')}>${s==='validee'?'Demande validée. Le client est prévenu par e-mail et a 48 h pour payer.':'Demande refusée. Motif envoyé au client : '+m}</div>`}<p className="mt-3.5 text-[13px] text-mute">Le client est prévenu par e-mail de votre réponse.</p><//></div /* ---------- sélecteur d’écrans (pour parcourir le template) ---------- */
const SC=[['Début',[['espace','Choix de l’espace']]],['Client',[['connexion','Connexion'],['accueil','Accueil'],['salle','Fiche salle'],['reservations','Mes réservations'],['paiement','Paiement']]],['Agent',[['agent-connexion','Connexion'],['agent-tableau','Tableau de bord'],['agent-salles','Mes salles'],['agent-salle-form','Modifier une salle'],['agent-dispo','Disponibilités'],['agent-demandes','Demandes'],['agent-demande','Détail d’une demande']]]];
const Switcher=({cur})=>{const[o,setO]=useState(false);return html`<div className="fixed right-4 z-50" style=${{bottom:'calc(16px + env(safe-area-inset-bottom, 0px))'}}>${o&&html`<div className="mb-2 max-h-[70vh] w-60 overflow-y-auto rounded-2xl border border-line bg-white p-3 shadow-xl">${SC.map(([g,l])=>html`<div key=${g}><p className="px-2 pb-1 pt-2 text-xs font-bold uppercase tracking-wide text-mute">${g}</p>${l.map(([k,t])=>html`<${Link} key=${k} to=${k} className=${cx('block rounded-lg px-2 py-1.5 text-sm',k===cur?'bg-brand-tint font-bold text-brand-dark':'hover:bg-page')}>${t}<//>`)}</div>`)}</div>`}<button onClick=${()=>setO(!o)} className="ml-auto flex h-11 items-center rounded-full bg-ink px-5 text-sm font-bold text-white shadow-lg">${o?'Fermer':'Écrans (13)'}</button></div>`};
const PAGES={espace:Landing,accueil:Home,connexion:()=>html`<${Login}/>`,salle:RoomPage,reservations:Reservations,paiement:Payment,'agent-connexion':()=>html`<${Login} agent/>`,'agent-tableau':Dash,'agent-salles':AgentRooms,'agent-salle-form':RoomForm,'agent-dispo':AgentAvail,'agent-demandes':Requests,'agent-demande':Request};
const App=()=>{const h=useHash(),P=PAGES[h]||Landing;return html`<${React.Fragment}><${P}/><${Switcher} cur=${h}/><//>`};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
